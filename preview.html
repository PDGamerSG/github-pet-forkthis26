<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Aesthetic Duck SVGs Preview</title>
<style>
  body {
    background: #fdf8f4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px;
    margin: 0;
  }
  h1 { color: #574b42; margin-bottom: 25px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    max-width: 760px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(220, 190, 170, 0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 1px solid #faece1;
  }
  .image-box {
    width: 130px;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, rgba(254, 240, 138, 0.4) 0%, rgba(244, 114, 182, 0.15) 60%, transparent 80%);
    border-radius: 50%;
  }
  .image-box img {
    width: 105px;
    height: 105px;
    object-fit: contain;
  }
  .label {
    margin-top: 14px;
    font-weight: 700;
    color: #786558;
    font-size: 14px;
  }
  .sub {
    font-size: 12px;
    color: #a39082;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <h1>✨ Aesthetic GitHub Pet - Duck Stages Preview ✨</h1>
  <div class="grid">
    <div class="card">
      <div class="image-box"><img src="extension/images/egg.svg" alt="Egg"></div>
      <div class="label">Egg</div>
      <div class="sub">Level: Egg 🌱</div>
    </div>
    <div class="card">
      <div class="image-box"><img src="extension/images/hatchling.svg" alt="Hatchling"></div>
      <div class="label">Hatchling (Neutral)</div>
      <div class="sub">Level: Hatchling</div>
    </div>
    <div class="card">
      <div class="image-box"><img src="extension/images/hatchling-happy.svg" alt="Hatchling Happy"></div>
      <div class="label">Hatchling (Happy)</div>
      <div class="sub">Mood: Happy / Motivated ✨</div>
    </div>
    <div class="card">
      <div class="image-box"><img src="extension/images/hatchling-sad.svg" alt="Hatchling Sad"></div>
      <div class="label">Hatchling (Sleepy/Sad)</div>
      <div class="sub">Mood: Sleepy 🥺</div>
    </div>
    <div class="card">
      <div class="image-box"><img src="extension/images/grown.svg" alt="Grown"></div>
      <div class="label">Grown Duck (Serene)</div>
      <div class="sub">Level: Grown 🌸</div>
    </div>
    <div class="card">
      <div class="image-box"><img src="extension/images/grown-happy.svg" alt="Grown Happy"></div>
      <div class="label">Grown Duck (Happy)</div>
      <div class="sub">Mood: Happy / Excited 💕</div>
    </div>
  </div>
</body>
</html>
