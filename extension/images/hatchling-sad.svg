<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Baby Duck Soft Yellow Body Gradient -->
    <linearGradient id="duckSadYellow" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="35%" stop-color="#FFE76A"/>
      <stop offset="85%" stop-color="#FFD13B"/>
      <stop offset="100%" stop-color="#F6B828"/>
    </linearGradient>

    <linearGradient id="beakSadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB366"/>
      <stop offset="100%" stop-color="#FF8A3D"/>
    </linearGradient>

    <!-- Tear Droplet Gradient -->
    <linearGradient id="tearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="40%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Tucked Little Feet -->
  <ellipse cx="48" cy="100" rx="7.5" ry="4" fill="#FF944D" stroke="#E67328" stroke-width="1.2"/>
  <ellipse cx="72" cy="100" rx="7.5" ry="4" fill="#FF944D" stroke="#E67328" stroke-width="1.2"/>

  <!-- Chubby Body Sitting Droopily -->
  <path d="M 33 76
           C 33 61, 42 58, 60 58
           C 78 58, 87 61, 87 76
           C 87 93, 76 100, 60 100
           C 44 100, 33 93, 33 76 Z"
        fill="url(#duckSadYellow)" stroke="#EAB308" stroke-width="2"/>

  <!-- Droopy Little Wings Hugging Body -->
  <path d="M 36 72 C 30 78, 34 89, 41 89 C 44 89, 44 81, 41 74 Z"
        fill="#F8CB34" stroke="#EAB308" stroke-width="1.8"/>
  <path d="M 84 72 C 90 78, 86 89, 79 89 C 76 89, 76 81, 79 74 Z"
        fill="#F8CB34" stroke="#EAB308" stroke-width="1.8"/>

  <!-- Head Tilted Slightly -->
  <ellipse cx="60" cy="47" rx="27" ry="25"
           fill="url(#duckSadYellow)" stroke="#EAB308" stroke-width="2"/>

  <!-- Droopy Sprout 🌱 -->
  <path d="M 60 22 C 60 16, 55 14, 50 13" stroke="#5E9C3E" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 51 14 C 43 11, 43 20, 51 17 Z" fill="#8CE558" stroke="#4D8632" stroke-width="1"/>
  <path d="M 52 13 C 58 7, 63 15, 54 15 Z" fill="#75D442" stroke="#4D8632" stroke-width="1"/>

  <!-- Watery Glossy Pleading Eyes (🥺 Kawaii Teary Eyes) -->
  <!-- Left Big Teary Eye -->
  <ellipse cx="46" cy="45" rx="5.8" ry="6.8" fill="#262220"/>
  <ellipse cx="44" cy="42" rx="2.8" ry="3.2" fill="#FFFFFF"/>
  <circle cx="48" cy="48" r="1.5" fill="#FFFFFF"/>
  <circle cx="44" cy="48.5" r="0.9" fill="#FFFFFF"/>
  <ellipse cx="46" cy="50" rx="3.5" ry="1.4" fill="#93C5FD" opacity="0.7"/>

  <!-- Right Big Teary Eye -->
  <ellipse cx="74" cy="45" rx="5.8" ry="6.8" fill="#262220"/>
  <ellipse cx="72" cy="42" rx="2.8" ry="3.2" fill="#FFFFFF"/>
  <circle cx="76" cy="48" r="1.5" fill="#FFFFFF"/>
  <circle cx="72" cy="48.5" r="0.9" fill="#FFFFFF"/>
  <ellipse cx="74" cy="50" rx="3.5" ry="1.4" fill="#93C5FD" opacity="0.7"/>

  <!-- Rosy Shivering Cheeks -->
  <ellipse cx="38" cy="54" rx="6.5" ry="4" fill="#FF8CA3" opacity="0.6"/>
  <ellipse cx="82" cy="54" rx="6.5" ry="4" fill="#FF8CA3" opacity="0.6"/>

  <!-- Adorable Glistening Teardrop on Cheek -->
  <path d="M 83 57 C 80 61, 80 65, 83 68 C 86 68, 87 64, 85 59 Z" fill="url(#tearGrad)"/>
  <circle cx="83.2" cy="64" r="1" fill="#FFFFFF" opacity="0.8"/>

  <!-- Down-turned Cute Pouting Beak -->
  <path d="M 50 53
           C 50 49, 70 49, 70 53
           C 68 59, 52 59, 50 53 Z"
        fill="url(#beakSadGrad)" stroke="#E6671E" stroke-width="1.6"/>
  <!-- Pout curve -->
  <path d="M 54 55 Q 60 52 66 55" stroke="#9A3412" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Soft Dreamy / Sleepy Floating Elements -->
  <circle cx="94" cy="35" r="4.5" fill="#BAE6FD" opacity="0.5" stroke="#7DD3FC" stroke-width="1"/>
  <circle cx="92.5" cy="33.5" r="1.2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="102" cy="25" r="2.5" fill="#BAE6FD" opacity="0.4" stroke="#7DD3FC" stroke-width="0.8"/>

  <path d="M 22 43 Q 22 46 25 46 Q 22 46 22 49 Q 22 46 19 46 Q 22 46 22 43 Z" fill="#93C5FD" opacity="0.7"/>
</svg>
