<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Warm Ivory / Buttercream Duck Body Gradient -->
    <linearGradient id="grownHBodyGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFFDF7"/>
      <stop offset="80%" stop-color="#FFF4DC"/>
      <stop offset="100%" stop-color="#FDE8C5"/>
    </linearGradient>

    <linearGradient id="grownHWingGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFF2D6"/>
      <stop offset="100%" stop-color="#FADCA7"/>
    </linearGradient>

    <linearGradient id="grownHBeakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB366"/>
      <stop offset="100%" stop-color="#FF8A3D"/>
    </linearGradient>

    <linearGradient id="petalHGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4EC"/>
      <stop offset="100%" stop-color="#FF758F"/>
    </linearGradient>
  </defs>

  <!-- Feet in Joyful Stance -->
  <ellipse cx="44" cy="98" rx="8.5" ry="4.5" fill="#FF944D" stroke="#E67328" stroke-width="1.2" transform="rotate(-10 44 98)"/>
  <ellipse cx="76" cy="98" rx="8.5" ry="4.5" fill="#FF944D" stroke="#E67328" stroke-width="1.2" transform="rotate(10 76 98)"/>

  <!-- Upturned Cute Tail Feathers -->
  <path d="M 28 76 C 14 68, 12 55, 21 51 C 25 61, 31 68, 38 72 Z"
        fill="url(#grownHWingGrad)" stroke="#F5D2A4" stroke-width="1.8"/>

  <!-- Plump Celebrating Body -->
  <path d="M 26 70
           C 26 51, 38 47, 60 47
           C 82 47, 94 51, 94 70
           C 94 91, 82 98, 60 98
           C 38 98, 26 91, 26 70 Z"
        fill="url(#grownHBodyGrad)" stroke="#F5D2A4" stroke-width="2"/>

  <!-- Left Wing Uplifted in Cheerful Waving Hug! -->
  <path d="M 36 63 C 22 51, 14 65, 23 76 C 30 80, 38 74, 38 68 Z"
        fill="url(#grownHWingGrad)" stroke="#E8C394" stroke-width="1.8"/>

  <!-- Right Wing Uplifted in Joy! -->
  <path d="M 84 63 C 98 51, 106 65, 97 76 C 90 80, 82 74, 82 68 Z"
        fill="url(#grownHWingGrad)" stroke="#E8C394" stroke-width="1.8"/>

  <!-- Head -->
  <ellipse cx="60" cy="35" rx="26" ry="24"
           fill="url(#grownHBodyGrad)" stroke="#F5D2A4" stroke-width="2"/>

  <!-- Glowing Blooming Flower & Sprout on Head -->
  <path d="M 60 12 C 58 5, 52 3, 48 1" stroke="#5E9C3E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 49 3 C 41 0, 41 8, 49 6 Z" fill="#8CE558" stroke="#4D8632" stroke-width="1"/>
  <!-- Blooming Flower Petals -->
  <circle cx="60" cy="7" r="4.5" fill="url(#petalHGrad)"/>
  <circle cx="66" cy="10" r="4.5" fill="url(#petalHGrad)"/>
  <circle cx="64" cy="16" r="4.5" fill="url(#petalHGrad)"/>
  <circle cx="56" cy="16" r="4.5" fill="url(#petalHGrad)"/>
  <circle cx="54" cy="10" r="4.5" fill="url(#petalHGrad)"/>
  <!-- Golden Center -->
  <circle cx="60" cy="11" r="3.4" fill="#FBBF24" stroke="#D97706" stroke-width="0.8"/>

  <!-- Joyful Curved Eyes (˶´ ˘ `˶) -->
  <path d="M 42 35 Q 47 28 53 35" stroke="#262220" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M 52 32 L 55 30" stroke="#262220" stroke-width="2" stroke-linecap="round"/>

  <path d="M 67 35 Q 73 28 78 35" stroke="#262220" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M 77 32 L 80 30" stroke="#262220" stroke-width="2" stroke-linecap="round"/>

  <!-- Extra Rosy Cheeks with Loving Heart Glow -->
  <ellipse cx="37" cy="41" rx="7" ry="4.5" fill="#FF7B95" opacity="0.65"/>
  <ellipse cx="83" cy="41" rx="7" ry="4.5" fill="#FF7B95" opacity="0.65"/>
  <circle cx="35.5" cy="40" r="1.3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="81.5" cy="40" r="1.3" fill="#FFFFFF" opacity="0.9"/>

  <!-- Open Smiling Happy Beak with Cute Tongue! -->
  <path d="M 50 38 C 50 34, 70 34, 70 38 C 71 45, 68 52, 60 52 C 52 52, 49 45, 50 38 Z"
        fill="url(#grownHBeakGrad)" stroke="#E6671E" stroke-width="1.6"/>
  <!-- Mouth Cavity -->
  <path d="M 53 42 C 53 48, 67 48, 67 42 C 65 50, 55 50, 53 42 Z" fill="#B91C1C"/>
  <ellipse cx="60" cy="46" rx="4.5" ry="2.6" fill="#FF758F"/>

  <!-- Floating Aesthetic Hearts & Stars 💕 -->
  <path d="M 18 28 C 14 23, 8 28, 18 37 C 28 28, 22 23, 18 28 Z" fill="#FF6B8B"/>
  <path d="M 100 16 C 97 12, 92 16, 100 23 C 108 16, 103 12, 100 16 Z" fill="#FFA3B5"/>

  <!-- Golden Stars (✦) -->
  <path d="M 88 10 Q 88 14 92 14 Q 88 14 88 18 Q 88 14 84 14 Q 88 14 88 10 Z" fill="#FFC947"/>
  <circle cx="95" cy="7" r="1.3" fill="#FFEAA7"/>
  <path d="M 27 16 Q 27 19 30 19 Q 27 19 27 22 Q 27 19 24 19 Q 27 19 27 16 Z" fill="#FFC947"/>
</svg>
