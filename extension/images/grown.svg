<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Warm Ivory / Buttercream Duck Body Gradient -->
    <linearGradient id="grownBodyGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFFDF7"/>
      <stop offset="80%" stop-color="#FFF4DC"/>
      <stop offset="100%" stop-color="#FDE8C5"/>
    </linearGradient>

    <!-- Wing Layer Gradient -->
    <linearGradient id="grownWingGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFF2D6"/>
      <stop offset="100%" stop-color="#FADCA7"/>
    </linearGradient>

    <!-- Adult Peach/Orange Beak -->
    <linearGradient id="grownBeakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB366"/>
      <stop offset="100%" stop-color="#FF8A3D"/>
    </linearGradient>

    <!-- Blossom Petal Gradient -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4EC"/>
      <stop offset="100%" stop-color="#FF8DA1"/>
    </linearGradient>
  </defs>

  <!-- Little Duck Feet Tucked Underneath -->
  <ellipse cx="46" cy="101" rx="9" ry="4.5" fill="#FF944D" stroke="#E67328" stroke-width="1.2"/>
  <ellipse cx="74" cy="101" rx="9" ry="4.5" fill="#FF944D" stroke="#E67328" stroke-width="1.2"/>

  <!-- Plump Tail Feathers (Cute upturned duck tail on the left) -->
  <path d="M 28 78 C 16 71, 14 58, 22 54 C 26 64, 32 70, 38 74 Z"
        fill="url(#grownWingGrad)" stroke="#F5D2A4" stroke-width="1.8"/>

  <!-- Chubby, Plump Body -->
  <path d="M 26 73
           C 26 54, 38 50, 60 50
           C 82 50, 94 54, 94 73
           C 94 94, 82 101, 60 101
           C 38 101, 26 94, 26 73 Z"
        fill="url(#grownBodyGrad)" stroke="#F5D2A4" stroke-width="2"/>

  <!-- Layered Aesthetic Wing with Scalloped Feathers -->
  <path d="M 36 68
           C 30 72, 32 86, 42 90
           C 52 94, 64 92, 70 84
           C 72 78, 68 70, 58 68
           C 48 66, 42 66, 36 68 Z"
        fill="url(#grownWingGrad)" stroke="#E8C394" stroke-width="1.8"/>
  <!-- Feather Scallop Accents -->
  <path d="M 44 76 Q 52 83 60 77" stroke="#E2B782" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 48 83 Q 56 89 63 83" stroke="#E2B782" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Elegant Cute Head -->
  <ellipse cx="64" cy="38" rx="26" ry="24"
           fill="url(#grownBodyGrad)" stroke="#F5D2A4" stroke-width="2"/>

  <!-- The Sprout has Bloomed into a Flower + Leaves! 🌸🌱 -->
  <!-- Green Leaves -->
  <path d="M 64 15 C 62 8, 56 6, 52 4" stroke="#5E9C3E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 53 6 C 45 3, 45 11, 53 9 Z" fill="#8CE558" stroke="#4D8632" stroke-width="1"/>
  <!-- Blooming Flower Petals -->
  <circle cx="64" cy="10" r="4.2" fill="url(#petalGrad)"/>
  <circle cx="70" cy="13" r="4.2" fill="url(#petalGrad)"/>
  <circle cx="68" cy="19" r="4.2" fill="url(#petalGrad)"/>
  <circle cx="60" cy="19" r="4.2" fill="url(#petalGrad)"/>
  <circle cx="58" cy="13" r="4.2" fill="url(#petalGrad)"/>
  <!-- Flower Golden Center -->
  <circle cx="64" cy="14" r="3.2" fill="#FBBF24" stroke="#D97706" stroke-width="0.8"/>

  <!-- Big Soulful Kawaii Eyes -->
  <ellipse cx="53" cy="36" rx="5.5" ry="6.5" fill="#262220"/>
  <ellipse cx="51.2" cy="33.8" rx="2.5" ry="3" fill="#FFFFFF"/>
  <circle cx="55" cy="38.5" r="1.4" fill="#FFFFFF"/>

  <ellipse cx="80" cy="36" rx="5.5" ry="6.5" fill="#262220"/>
  <ellipse cx="78.2" cy="33.8" rx="2.5" ry="3" fill="#FFFFFF"/>
  <circle cx="82" cy="38.5" r="1.4" fill="#FFFFFF"/>

  <!-- Soft Glowing Rosy Cheeks -->
  <ellipse cx="44" cy="43" rx="6.5" ry="4" fill="#FFAAA6" opacity="0.6"/>
  <ellipse cx="88" cy="43" rx="6.5" ry="4" fill="#FFAAA6" opacity="0.6"/>
  <circle cx="42.5" cy="42" r="1.2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="86.5" cy="42" r="1.2" fill="#FFFFFF" opacity="0.8"/>

  <!-- Aesthetic Smooth Adult Beak -->
  <path d="M 57 40
           C 57 35, 76 35, 76 40
           C 78 48, 73 51, 66 51
           C 60 51, 55 48, 57 40 Z"
        fill="url(#grownBeakGrad)" stroke="#E6671E" stroke-width="1.6"/>
  <!-- Beak highlight -->
  <path d="M 61 39 Q 66 37 72 39" stroke="#FFD8A8" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Floating Aesthetic Sparkles (✦) -->
  <path d="M 98 21 Q 98 25 102 25 Q 98 25 98 29 Q 98 25 94 25 Q 98 25 98 21 Z" fill="#FFC947"/>
  <circle cx="104" cy="18" r="1.4" fill="#FFEAA7"/>
  <path d="M 22 38 Q 22 41 25 41 Q 22 41 22 44 Q 22 41 19 41 Q 22 41 22 38 Z" fill="#FFB7B2"/>
</svg>
