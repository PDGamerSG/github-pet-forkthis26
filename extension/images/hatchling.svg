<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Baby Duck Yellow Body Gradient -->
    <linearGradient id="duckYellowGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="35%" stop-color="#FFE76A"/>
      <stop offset="85%" stop-color="#FFD13B"/>
      <stop offset="100%" stop-color="#F6B828"/>
    </linearGradient>

    <!-- Wing Gradient -->
    <linearGradient id="wingGrad" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#FFF5A5"/>
      <stop offset="100%" stop-color="#F7C631"/>
    </linearGradient>

    <!-- Beak Gradient -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB366"/>
      <stop offset="100%" stop-color="#FF8A3D"/>
    </linearGradient>
  </defs>

  <!-- Cute Little Duck Feet -->
  <ellipse cx="48" cy="100" rx="8" ry="4.5" fill="#FF944D" stroke="#E67328" stroke-width="1.2"/>
  <ellipse cx="72" cy="100" rx="8" ry="4.5" fill="#FF944D" stroke="#E67328" stroke-width="1.2"/>

  <!-- Chubby Body -->
  <path d="M 33 76
           C 33 61, 42 58, 60 58
           C 78 58, 87 61, 87 76
           C 87 94, 76 100, 60 100
           C 44 100, 33 94, 33 76 Z"
        fill="url(#duckYellowGrad)" stroke="#EAB308" stroke-width="2"/>

  <!-- Left Wing (Resting) -->
  <path d="M 34 70 C 27 74, 26 85, 36 87 C 40 87, 41 78, 38 71 Z"
        fill="url(#wingGrad)" stroke="#EAB308" stroke-width="1.8"/>

  <!-- Right Wing (Resting) -->
  <path d="M 86 70 C 93 74, 94 85, 84 87 C 80 87, 79 78, 82 71 Z"
        fill="url(#wingGrad)" stroke="#EAB308" stroke-width="1.8"/>

  <!-- Big Kawaii Head -->
  <ellipse cx="60" cy="45" rx="27" ry="25"
           fill="url(#duckYellowGrad)" stroke="#EAB308" stroke-width="2"/>

  <!-- Cute Fluffy Forehead Tufts -->
  <path d="M 57 20 C 58 16, 62 16, 63 20" stroke="#EAB308" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Signature Sprout 🌱 on head -->
  <path d="M 60 20 C 60 13, 58 10, 56 6" stroke="#5E9C3E" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 56 8 C 47 4, 46 13, 55 10 Z" fill="#8CE558" stroke="#4D8632" stroke-width="1"/>
  <path d="M 57 7 C 66 2, 68 11, 58 9 Z" fill="#75D442" stroke="#4D8632" stroke-width="1"/>

  <!-- Left Soulful Kawaii Eye -->
  <ellipse cx="46" cy="43" rx="5.5" ry="6.5" fill="#262220"/>
  <ellipse cx="44.2" cy="40.8" rx="2.5" ry="3" fill="#FFFFFF"/>
  <circle cx="48" cy="45.5" r="1.4" fill="#FFFFFF"/>

  <!-- Right Soulful Kawaii Eye -->
  <ellipse cx="74" cy="43" rx="5.5" ry="6.5" fill="#262220"/>
  <ellipse cx="72.2" cy="40.8" rx="2.5" ry="3" fill="#FFFFFF"/>
  <circle cx="76" cy="45.5" r="1.4" fill="#FFFFFF"/>

  <!-- Rosy Glowing Blushing Cheeks -->
  <ellipse cx="38" cy="51" rx="6.5" ry="4" fill="#FF8CA3" opacity="0.6"/>
  <ellipse cx="82" cy="51" rx="6.5" ry="4" fill="#FF8CA3" opacity="0.6"/>
  <circle cx="36.5" cy="50" r="1.2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="80.5" cy="50" r="1.2" fill="#FFFFFF" opacity="0.8"/>

  <!-- Chubby Sweet Beak -->
  <path d="M 50 47
           C 50 43, 70 43, 70 47
           C 72 55, 67 58, 60 58
           C 53 58, 48 55, 50 47 Z"
        fill="url(#beakGrad)" stroke="#E6671E" stroke-width="1.6"/>
  <!-- Beak highlight line -->
  <path d="M 54 46 Q 60 44 66 46" stroke="#FFD8A8" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Aesthetic Sparkle Stars -->
  <path d="M 94 28 Q 94 32 98 32 Q 94 32 94 36 Q 94 32 90 32 Q 94 32 94 28 Z" fill="#FFC947"/>
  <circle cx="22" cy="40" r="1.8" fill="#FFB7B2" opacity="0.8"/>
</svg>
