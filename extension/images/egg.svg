<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Egg Body Gradient -->
    <linearGradient id="eggBodyGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFFDF7"/>
      <stop offset="70%" stop-color="#FFF2DB"/>
      <stop offset="100%" stop-color="#FCDDB8"/>
    </linearGradient>

    <!-- Shell Inner Warm Glow -->
    <radialGradient id="eggGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFEED4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F7D3A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cozy Little Nest / Cushion Leaves at Base -->
  <path d="M 30 96 C 35 90, 45 92, 52 97" stroke="#A7DCA1" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 68 97 C 75 91, 85 90, 90 96" stroke="#A7DCA1" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 45 100 C 53 95, 67 95, 75 100" stroke="#89CD82" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Smooth Chubby Egg Shape -->
  <path d="M 60 20
           C 78 20, 94 46, 94 70
           C 94 90, 79 100, 60 100
           C 41 100, 26 90, 26 70
           C 26 46, 42 20, 60 20 Z"
        fill="url(#eggBodyGrad)" stroke="#F5D2A4" stroke-width="2.5"/>

  <!-- Egg Soft 3D Glow Highlight -->
  <path d="M 60 20
           C 78 20, 94 46, 94 70
           C 94 90, 79 100, 60 100
           C 41 100, 26 90, 26 70
           C 26 46, 42 20, 60 20 Z"
        fill="url(#eggGlow)"/>

  <!-- Cute Pastel Speckles -->
  <circle cx="43" cy="48" r="2.2" fill="#F3BF8A" opacity="0.5"/>
  <circle cx="39" cy="56" r="1.4" fill="#F3BF8A" opacity="0.4"/>
  <circle cx="76" cy="52" r="2.5" fill="#F3BF8A" opacity="0.5"/>
  <circle cx="81" cy="61" r="1.6" fill="#F3BF8A" opacity="0.4"/>
  <circle cx="68" cy="42" r="1.8" fill="#F3BF8A" opacity="0.4"/>
  <circle cx="48" cy="85" r="2" fill="#F3BF8A" opacity="0.45"/>
  <circle cx="73" cy="83" r="1.7" fill="#F3BF8A" opacity="0.45"/>

  <!-- Adorable Sleeping Face on Egg ( ˘ ᵕ ˘ ) -->
  <!-- Left sleeping eye -->
  <path d="M 45 66 Q 50 62 54 66" stroke="#7A685A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Right sleeping eye -->
  <path d="M 66 66 Q 70 62 75 66" stroke="#7A685A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Little sweet smile -->
  <path d="M 58 71 Q 60 74 62 71" stroke="#8C705D" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Rosy Blushing Cheeks -->
  <ellipse cx="43" cy="71" rx="5" ry="3" fill="#FFAAA6" opacity="0.6"/>
  <ellipse cx="77" cy="71" rx="5" ry="3" fill="#FFAAA6" opacity="0.6"/>
  <circle cx="42" cy="70" r="1" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="76" cy="70" r="1" fill="#FFFFFF" opacity="0.8"/>

  <!-- Signature Sprout 🌱 on top -->
  <path d="M 60 21 C 60 14, 58 11, 56 7" stroke="#68A848" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Left Sprout Leaf -->
  <path d="M 56 9 C 47 5, 46 14, 55 11 Z" fill="#8CE558" stroke="#5E9C3E" stroke-width="1"/>
  <!-- Right Sprout Leaf -->
  <path d="M 57 8 C 66 3, 68 12, 58 10 Z" fill="#75D442" stroke="#5E9C3E" stroke-width="1"/>

  <!-- Aesthetic Floating Sparkles (✦) -->
  <path d="M 88 26 Q 88 31 93 31 Q 88 31 88 36 Q 88 31 83 31 Q 88 31 88 26 Z" fill="#FFC947"/>
  <circle cx="95" cy="23" r="1.3" fill="#FFEAA7"/>
  <path d="M 22 50 Q 22 53 25 53 Q 22 53 22 56 Q 22 53 19 53 Q 22 53 22 50 Z" fill="#FFB7B2"/>
  <circle cx="28" cy="36" r="2" fill="#FFEAA7" opacity="0.7"/>
</svg>
